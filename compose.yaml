name: snail-club
services:
  app:
    build: .
    image: snail-club:local
    restart: unless-stopped
    ports:
      - '127.0.0.1:4334:3001'
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3001'
      SNAILPAY_MODE: normal
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
